                  type: integer
                answers:
                  type: array
                  items:
                    type: object
                    required: [answer_id, score]
                    properties:
                      answer_id:
                        type: integer
                      score:
                        type: number
                      comment:
                        type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/exams/{id}/auto-grade:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [阅卷]
      summary: 触发客观题自动阅卷（教师/系统）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          graded_count:
                            type: integer
  /api/exams/{id}/grade-progress:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [阅卷]
      summary: 阅卷进度查看（教师）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total_count:
