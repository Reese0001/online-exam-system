                    properties:
                      data:
                        type: object
                        properties:
                          exam_record_id:
                            type: integer
                          paper:
                            $ref: '#/components/schemas/PaperDetail'
                          remain_seconds:
                            type: integer
        '400':
          description: 考试未在时间窗口内
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 4001
                message: 考试未在时间窗口内
                data: null
  /api/exams/{id}/answers:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [在线答题]
      summary: 答案暂存（学生）
      description: 实时/定时暂存单题答案至服务端，支持断网续答
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, student_answer]
              properties:
                question_id:
                  type: integer
                student_answer:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/exams/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [在线答题]
      summary: 交卷（学生）
      description: 主动交卷或倒计时自动交卷，触发客观题自动阅卷
      responses:
        '200':
          description: 交卷成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          exam_record_id:
                            type: integer
                          objective_score:
                            type: number
                          has_subjective:
                            type: boolean
        '409':
          description: 已交卷，不可重复提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 4002
                message: 已交卷，不可重复提交
                data: null
  /api/exams/{id}/record:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [在线答题]
      summary: 查看答题记录（学生）
      description: 考试结束后查看本人答题与得分
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamRecordDetail'
  /api/exams/student/list:
    get:
      tags: [在线答题]
      summary: 学生考试列表（学生）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            exam_id:
                              type: integer
                            name:
                              type: string
                            status:
                              type: string
                            start_time:
                              type: string
                              format: date-time
                            end_time:
                              type: string
                              format: date-time
                            record_status:
                              type: string
