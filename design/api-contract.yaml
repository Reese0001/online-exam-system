      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/GradeTaskInfo'
                          total:
                            type: integer
                          page:
                            type: integer
                          pageSize:
                            type: integer
  /api/grade-tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [阅卷]
      summary: 阅卷任务详情（教师）
      description: 获取待阅卷的学生答卷列表（主观题）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task:
                            $ref: '#/components/schemas/GradeTaskInfo'
                          records:
                            type: array
                            items:
                              type: object
                              properties:
                                exam_record_id:
                                  type: integer
                                student_name:
                                  type: string
