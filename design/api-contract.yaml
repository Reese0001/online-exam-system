  /api/scores/wrong-questions:
    get:
      tags: [成绩统计]
      summary: 错题统计（学生）
      parameters:
        - name: exam_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            exam_id:
                              type: integer
                            exam_name:
                              type: string
                            question_id:
                              type: integer
                            content:
                              type: string
                            student_answer:
                              type: string
                            correct_answer:
                              type: string
                            analysis:
                              type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 认证
  parameters:
    Page:
      name: page
      in: query
      description: 页码（从1开始）
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Id:
      name: id
      in: path
      required: true
      description: 资源ID
      schema:
        type: integer
  responses:
    Success:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseResponse'
          example:
            code: 200
            message: 操作成功
            data: null
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 400
            message: 请求参数错误
            data: null
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 404
            message: 资源不存在
            data: null
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    BaseResponse:
      type: object
      description: 统一响应格式
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: 操作成功
        data:
          description: 业务数据
    ErrorResponse:
      type: object
      description: 错误响应
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: 请求参数错误
        data:
          nullable: true
          example: null
    PageData:
      type: object
      description: 分页数据
      properties:
        list:
          type: array
          items:
            type: object
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    UserInfo:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        real_name:
          type: string
        role:
          type: string
          enum: [admin, teacher, student]
        email:
          type: string
        phone:
          type: string
        class_id:
          type: integer
          nullable: true
        class_name:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
    UserCreate:
      type: object
      required: [username, password, real_name, role]
      properties:
        username:
          type: string
        password:
          type: string
        real_name:
          type: string
        role:
          type: string
          enum: [admin, teacher, student]
        email:
          type: string
        phone:
          type: string
        class_id:
          type: integer
        status:
          type: string
          enum: [active, disabled]
          default: active
    UserUpdate:
      type: object
      properties:
        real_name:
          type: string
        email:
          type: string
        phone:
          type: string
        class_id:
          type: integer
        status:
          type: string
          enum: [active, disabled]
    ClassInfo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        grade:
          type: string
        department:
          type: string
        student_count:
          type: integer
        created_at:
          type: string
          format: date-time
    ClassCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        grade:
          type: string
        department:
          type: string
    QuestionInfo:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [single, multiple, judge, fill, short]
        content:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              text:
                type: string
        answer:
          type: string
        analysis:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        knowledge_point:
          type: string
        score:
          type: number
        creator_id:
          type: integer
        creator_name:
          type: string
        created_at:
          type: string
          format: date-time
    QuestionCreate:
      type: object
      required: [type, content, answer, difficulty, score]
      properties:
        type:
          type: string
          enum: [single, multiple, judge, fill, short]
        content:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              text:
                type: string
        answer:
          type: string
        analysis:
          type: string
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        knowledge_point:
          type: string
        score:
          type: number
    PaperInfo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        total_score:
          type: number
        duration:
          type: integer
        pass_score:
          type: number
        is_random_order:
          type: boolean
        creator_id:
          type: integer
        creator_name:
          type: string
        status:
          type: string
          enum: [draft, published]
        question_count:
          type: integer
        created_at:
          type: string
          format: date-time
    PaperCreate:
      type: object
      required: [name, total_score, duration, pass_score]
      properties:
        name:
          type: string
        description:
          type: string
        total_score:
          type: number
        duration:
          type: integer
        pass_score:
          type: number
        is_random_order:
          type: boolean
          default: false
        status:
          type: string
          enum: [draft, published]
          default: draft
    PaperDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/PaperInfo'
        - type: object
          properties:
            questions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  question_id:
                    type: integer
                  type:
                    type: string
                  content:
                    type: string
                  options:
                    type: array
                    items:
                      type: object
                  score:
                    type: number
                  sort_order:
                    type: integer
    ExamInfo:
      type: object
      properties:
        id:
          type: integer
        paper_id:
          type: integer
        paper_name:
          type: string
        name:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, published, ongoing, finished]
        creator_id:
          type: integer
        creator_name:
          type: string
        class_count:
          type: integer
        student_count:
          type: integer
        created_at:
          type: string
          format: date-time
    ExamCreate:
      type: object
      required: [paper_id, name, start_time, end_time]
      properties:
        paper_id:
          type: integer
        name:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        class_ids:
          type: array
          items:
            type: integer
        status:
          type: string
          enum: [draft, published, ongoing, finished]
          default: draft
    ExamDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/ExamInfo'
        - type: object
          properties:
            classes:
              type: array
              items:
                $ref: '#/components/schemas/ClassInfo'
            paper:
              $ref: '#/components/schemas/PaperDetail'
    ExamRecordDetail:
      type: object
      properties:
        exam_record_id:
          type: integer
        exam_name:
          type: string
        status:
          type: string
          enum: [not_started, ongoing, submitted, graded]
        total_score:
          type: number
        start_time:
          type: string
          format: date-time
        submit_time:
          type: string
          format: date-time
          nullable: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerInfo'
    AnswerInfo:
      type: object
      properties:
        id:
          type: integer
        question_id:
          type: integer
        question_content:
          type: string
        question_type:
          type: string
        student_answer:
          type: string
        correct_answer:
          type: string
        score:
          type: number
          nullable: true
        full_score:
          type: number
        is_correct:
          type: boolean
          nullable: true
        analysis:
          type: string
        comment:
          type: string
    GradeTaskInfo:
      type: object
      properties:
        id:
          type: integer
        exam_id:
          type: integer
        exam_name:
          type: string
        teacher_id:
          type: integer
        teacher_name:
          type: string
        status:
          type: string
          enum: [pending, ongoing, finished]
        total_count:
          type: integer
        graded_count:
          type: integer
        progress:
          type: number
        created_at:
          type: string
          format: date-time