          description: 阅卷任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 6001
                message: 阅卷任务不存在
                data: null
  /api/grade-tasks/{id}/grade:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [阅卷]
      summary: 手动评分（教师）
      description: 对主观题逐题评分并可填写评语
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exam_record_id, answers]
              properties:
